<ngx-file-upload-ui--toolbar [storage]="uploadStorage"></ngx-file-upload-ui--toolbar>

<div class="upload--body fileupload" ngxFileUpload (add)="dropFiles($event)">

  @if (!uploads.length) {
    <div class="file-browser">
      <i class="ngx-fileupload-icon--add"></i>
      <span>{{ i18n?.SELECT_FILES || "Drag/Drop files here or click"}}</span>
    </div>
  }

  @if (uploads.length) {
    <div class="file-upload--list">
      @for (item of uploads; track item) {
        <ngx-file-upload-ui--item [upload]="item" [template]="itemTemplate" >
        </ngx-file-upload-ui--item>
      }
    </div>
  }
</div>
